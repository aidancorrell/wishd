name: Bug report
description: Report a reproducible problem in wish:d.
body:
  - type: markdown
    attributes:
      value: Use synthetic data and remove tokens, account IDs and SQL containing private data. Report vulnerabilities through SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Setup, commands, expected behavior and actual behavior.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python, Postgres, deployment method and producer versions.
